<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Sidebar</title>
<link rel="stylesheet" href="sidebar.css">
</head>
<body>

  <header class="topbar">
    <button id="addSiteButton" class="topbar-button" type="button" title="Add a custom website" aria-label="Add a custom website">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <main class="content">

    <!-- Recently used (hidden until a site has been opened) -->
    <section id="recentSection" class="recent hidden">
      <h2 class="section-title">Recently used</h2>
      <button id="recentCard" class="recent-card" type="button">
        <img id="recentIcon" class="recent-icon" alt="">
        <span class="recent-meta">
          <span id="recentLabel" class="recent-label"></span>
          <span id="recentHint" class="recent-hint"></span>
        </span>
        <span class="recent-arrow">→</span>
      </button>
    </section>

    <!-- All AI sites -->
    <h2 class="section-title">All assistants</h2>
    <div id="siteGrid" class="grid"></div>

    <section id="hiddenSection" class="hidden-section hidden">
      <button id="hiddenToggle" class="hidden-toggle" type="button" aria-expanded="false" aria-controls="hiddenGrid">
        <svg class="hidden-chevron" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        <span id="hiddenLabel">Hidden</span>
      </button>
      <div id="hiddenGrid" class="grid hidden-grid"></div>
    </section>

  </main>

  <footer class="footer">
    <a class="github-link" href="https://github.com/ai-sidebar" target="_blank" rel="noopener noreferrer" title="https://github.com/ai-sidebar">
      <svg class="github-icon" viewBox="0 0 16 16" width="17" height="17" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      <span>Github</span>
    </a>
    <span class="footer-divider" aria-hidden="true">|</span>
    <span id="versionLabel" class="version"></span>
  </footer>

  <!-- Add a custom website -->
  <div id="addDialog" class="dialog-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="addDialogTitle">
    <form id="addForm" class="dialog" novalidate>
      <h3 id="addDialogTitle" class="dialog-title">Add a website</h3>

      <label class="field">
        <span class="field-label">Website</span>
        <input id="addUrl" class="field-input" type="text" inputmode="url" placeholder="https://example.com" autocomplete="off" spellcheck="false">
      </label>

      <label class="field">
        <span class="field-label">Name (optional)</span>
        <input id="addName" class="field-input" type="text" placeholder="My assistant" autocomplete="off" spellcheck="false">
      </label>

      <p id="addError" class="dialog-error hidden" role="alert"></p>

      <div class="dialog-actions">
        <button id="addCancel" class="btn btn-ghost" type="button">Cancel</button>
        <button class="btn btn-primary" type="submit">Add</button>
      </div>
    </form>
  </div>

  <!-- Loading overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden" role="status" aria-label="Loading">
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
